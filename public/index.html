<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Coverage requests</title>
  <meta name="description" content="Photo and video coverage requests, by day and week.">
  <meta name="theme-color" content="#f5c518">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Coverage">
  <link rel="stylesheet" href="css/app.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
<header class="bar">
  <h1 data-i18n="app.name">Coverage requests</h1>
  <span id="who"></span>
  <button type="button" id="lang" data-i18n="lang.other">العربية</button>
  <button type="button" id="signin-open" data-i18n="signIn">Staff sign-in</button>
  <button type="button" id="signout" data-i18n="signOut" hidden>Sign out</button>
</header>

<main>
  <form id="entry" hidden autocomplete="off">
    <label class="wide">
      <span data-i18n="f.activity">Event</span>
      <input name="activity" required maxlength="200" enterkeyhint="done">
    </label>
    <fieldset class="wide dates">
      <legend data-i18n="f.date">Date</legend>
      <button type="button" data-offset="0" data-i18n="today">Today</button>
      <button type="button" data-offset="1" data-i18n="tomorrow">Tomorrow</button>
      <button type="button" data-offset="2" data-i18n="plus2">In 2 days</button>
      <input type="date" name="day" required data-i18n-aria="f.date">
    </fieldset>
    <label>
      <span data-i18n="f.time">Time</span>
      <input type="time" name="start_time">
    </label>
    <label>
      <span data-i18n="f.building">Building</span>
      <select name="building" required><option value="" data-i18n="choose">Choose…</option></select>
    </label>
    <label class="wide">
      <span data-i18n="f.notes">Notes</span>
      <input name="notes" maxlength="2000" enterkeyhint="done">
    </label>
    <div class="wide actions">
      <button id="save" class="primary" data-i18n="add">Add request</button>
      <button type="button" id="cancel-edit" data-i18n="cancel" hidden>Cancel</button>
      <button type="button" id="delete" class="danger" data-i18n="delete" hidden>Delete</button>
    </div>
  </form>

  <nav class="views">
    <span class="toggle">
      <button type="button" data-view="day" data-i18n="view.day">Day</button><button type="button" data-view="week" data-i18n="view.week">Week</button>
    </span>
    <button type="button" id="prev" class="arrow" data-i18n-aria="prev" aria-label="Previous">‹</button>
    <strong id="range-label"></strong>
    <button type="button" id="next" class="arrow" data-i18n-aria="next" aria-label="Next">›</button>
    <button type="button" id="today" data-i18n="today">Today</button>
  </nav>

  <p id="msg" role="status" aria-live="polite"></p>
  <div id="queue"></div>
</main>

<dialog id="signin">
  <form id="signin-form">
    <h2 data-i18n="signIn">Staff sign-in</h2>
    <label><span data-i18n="password">Password</span><input type="password" name="password" required autocomplete="current-password"></label>
    <div class="actions">
      <button class="primary" data-i18n="signInBtn">Sign in</button>
      <button type="button" id="signin-cancel" data-i18n="cancel">Cancel</button>
    </div>
  </form>
</dialog>
</body>
</html>
